<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ barRef }}" style="position:sticky;top:0;z-index:60;background:rgba(244,246,251,0.88);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid #E6EAF2;transition:box-shadow .25s ease,padding .25s ease;padding:10px clamp(20px,4vw,40px)">
  <span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#9AA2FB,#3ED6EE 55%,rgba(62,214,238,0))"></span>
  <a href="#main" style="position:absolute;left:16px;top:-56px;z-index:90;background:#0D0B22;color:#fff;padding:10px 16px;border-radius:10px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;font-weight:600;text-decoration:none;transition:top .18s ease" style-focus="top:10px">Skip to content</a>
  <div style="max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:64px">
    <a href="{{ homeHref }}" style="display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0" aria-label="DocHive home">
      <svg viewBox="0 0 64 64" width="60" height="60" fill="none" aria-hidden="true" style="filter:drop-shadow(0 6px 14px rgba(129,140,248,0.38))">
        <defs>
          <linearGradient id="dh" x1="7" y1="10" x2="57" y2="54" gradientUnits="userSpaceOnUse">
            <stop stop-color="#5F5CEC"></stop><stop offset="1" stop-color="#06B6D4"></stop>
          </linearGradient>
        </defs>
        <path d="M7 32 L19.5 10.4 L44.5 10.4 L57 32 L44.5 53.6 L19.5 53.6 Z" fill="url(#dh)"></path>
        <rect x="21" y="21" width="5" height="22" rx="2.2" fill="#fff"></rect>
        <rect x="38" y="21" width="5" height="22" rx="2.2" fill="#fff"></rect>
        <rect x="21" y="29.5" width="22" height="5" rx="2.2" fill="#A5F3FC"></rect>
      </svg>
      <span style="font-size:34px;font-weight:700;letter-spacing:-0.035em;color:#0D0B22">Doc<span style="background-image:linear-gradient(135deg,#7C7AF2,#2ED3EF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">Hive</span></span>
    </a>

    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;align-items:center;gap:clamp(18px,2.4vw,30px)">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="5">
          <a href="{{ item.href }}" aria-current="{{ item.current }}" style="position:relative;display:block;padding:8px 0;font-size:15px;letter-spacing:-0.01em;text-decoration:none;color:#0D0B22;font-weight:{{ item.weight }}" style-hover="color:#5F5CEC">{{ item.label }}<sc-if value="{{ item.active }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:2px;background:#5F5CEC;border-radius:2px"></span></sc-if></a>
        </sc-for>
        <a href="{{ contactHref }}" style="display:inline-flex;align-items:center;padding:11px 18px;border-radius:11px;background:linear-gradient(135deg,#7C7AF2,#2ED3EF);color:#fff;font-size:15px;font-weight:600;letter-spacing:-0.01em;text-decoration:none;transition:filter .2s ease,transform .2s ease" style-hover="filter:brightness(1.07);transform:translateY(-1px)">Book a call</a>
        <div ref="{{ langRef }}" style="position:relative">
          <button type="button" onClick="{{ toggleLang }}" aria-expanded="{{ langOpenStr }}" aria-haspopup="menu" aria-label="Change language" style="display:flex;align-items:center;gap:7px;height:42px;padding:0 10px;border-radius:11px;border:1px solid #E6EAF2;background:#fff;cursor:pointer;transition:border-color .18s ease" style-hover="border-color:#9AA2FB">
            <svg viewBox="0 0 60 30" width="27" height="20" style="border-radius:3px" aria-hidden="true">
              <clipPath id="ukc"><path d="M0 0h60v30H0z"></path></clipPath>
              <g clip-path="url(#ukc)">
                <path fill="#012169" d="M0 0h60v30H0z"></path>
                <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30"></path>
                <path stroke="#C8102E" stroke-width="3" d="M0 0l60 30M60 0L0 30"></path>
                <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"></path>
                <path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"></path>
              </g>
            </svg>
            <svg viewBox="0 0 12 8" width="11" height="8" fill="none" aria-hidden="true"><path d="M1 1.5L6 6.5L11 1.5" stroke="#5B6B80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </button>
          <sc-if value="{{ langOpen }}" hint-placeholder-val="{{ false }}">
            <div role="menu" style="position:absolute;top:calc(100% + 10px);right:0;min-width:190px;padding:6px;background:#fff;border:1px solid #E6EAF2;border-radius:13px;box-shadow:0 26px 50px -26px rgba(13,11,34,0.45);z-index:70">
              <a href="{{ homeHref }}" role="menuitem" aria-current="true" style="display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;background:rgba(129,137,248,0.10);font-size:15px;font-weight:600;color:#0D0B22;text-decoration:none">
                <svg viewBox="0 0 60 30" width="24" height="18" style="border-radius:2px" aria-hidden="true">
                  <clipPath id="ukd"><path d="M0 0h60v30H0z"></path></clipPath>
                  <g clip-path="url(#ukd)">
                    <path fill="#012169" d="M0 0h60v30H0z"></path>
                    <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30"></path>
                    <path stroke="#C8102E" stroke-width="3" d="M0 0l60 30M60 0L0 30"></path>
                    <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"></path>
                    <path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"></path>
                  </g>
                </svg>English</a>
              <span role="menuitem" aria-disabled="true" style="display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;font-size:15px;color:#94A3B8;cursor:default">
                <svg viewBox="0 0 32 32" width="18" height="18" style="border-radius:2px;opacity:0.75" aria-hidden="true">
                  <path fill="#D52B1E" d="M0 0h32v32H0z"></path>
                  <path fill="#fff" d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z"></path>
                </svg>Deutsch <span style="font-size:12px;color:#B4BCCB">bald</span></span>
            </div>
          </sc-if>
        </div>
      </nav>
    </sc-if>

    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggle }}" aria-expanded="{{ openStr }}" aria-label="Open menu" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;padding:0 11px;background:#fff;border:1px solid #E6EAF2;border-radius:12px;cursor:pointer">
        <span aria-hidden="true" style="display:block;height:2px;background:#0D0B22;border-radius:2px"></span>
        <span aria-hidden="true" style="display:block;height:2px;background:#0D0B22;border-radius:2px"></span>
        <span aria-hidden="true" style="display:block;height:2px;width:14px;background:#5F5CEC;border-radius:2px"></span>
      </button>
    </sc-if>
  </div>
</div>

<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:80;background:#F4F6FB;display:flex;flex-direction:column;padding:20px clamp(20px,6vw,32px) 32px;overflow-y:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:56px">
      <span style="font-size:12px;letter-spacing:0.2em;font-weight:600;color:#5B6B80;text-transform:uppercase">Menu</span>
      <button type="button" onClick="{{ toggle }}" aria-label="Close menu" style="width:44px;height:44px;background:#fff;border:1px solid #E6EAF2;border-radius:12px;font-size:20px;line-height:1;color:#0D0B22;cursor:pointer">×</button>
    </div>
    <nav aria-label="Main" style="display:flex;flex-direction:column;gap:2px;margin-top:24px">
      <sc-for list="{{ navFull }}" as="item" hint-placeholder-count="6">
        <a href="{{ item.href }}" style="display:flex;align-items:center;min-height:56px;padding:0 4px;border-bottom:1px solid #E6EAF2;font-size:22px;letter-spacing:-0.02em;text-decoration:none;color:#0D0B22;font-weight:{{ item.weight }}">{{ item.label }}</a>
      </sc-for>
    </nav>
    <div role="group" aria-label="Language" style="display:flex;align-items:center;gap:10px;margin-top:28px">
      <a href="{{ homeHref }}" aria-current="true" title="English" style="display:flex;align-items:center;gap:9px;min-height:44px;padding:9px 14px;border-radius:11px;border:1.5px solid #9AA2FB;background:#fff;font-size:15px;font-weight:600;color:#0D0B22;text-decoration:none">
        <svg viewBox="0 0 60 30" width="28" height="20" style="border-radius:3px" aria-hidden="true">
          <clipPath id="ukm"><path d="M0 0h60v30H0z"></path></clipPath>
          <g clip-path="url(#ukm)">
            <path fill="#012169" d="M0 0h60v30H0z"></path>
            <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30"></path>
            <path stroke="#C8102E" stroke-width="3" d="M0 0l60 30M60 0L0 30"></path>
            <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"></path>
            <path stroke="#C8102E" stroke-width="6" d="M30 0v30M0 15h60"></path>
          </g>
        </svg>English</a>
      <span title="Deutsch, in Vorbereitung" aria-disabled="true" style="display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:11px;border:1px solid #E6EAF2;font-size:15px;color:#94A3B8;opacity:0.65">
        <svg viewBox="0 0 32 32" width="20" height="20" style="border-radius:3px" aria-hidden="true">
          <path fill="#D52B1E" d="M0 0h32v32H0z"></path>
          <path fill="#fff" d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z"></path>
        </svg>Deutsch</span>
    </div>
    <a href="{{ contactHref }}" style="display:flex;align-items:center;justify-content:center;margin-top:auto;min-height:56px;border-radius:14px;background:linear-gradient(135deg,#7C7AF2,#2ED3EF);color:#fff;font-size:17px;font-weight:600;text-decoration:none">Book a 20 minute call</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;home&quot;,&quot;how&quot;,&quot;use&quot;,&quot;pricing&quot;,&quot;resources&quot;,&quot;faq&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;base&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { narrow: false, ready: false, open: false, langOpen: false };
  barRef = React.createRef();
  langRef = React.createRef();

  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 900px)');
    this.onMq = () => {
      document.body.style.overflow = '';
      this.setState({ narrow: this.mq.matches, open: false });
    };
    this.setState({ narrow: this.mq.matches, ready: true });
    this.mq.addEventListener('change', this.onMq);
    this.onScroll = () => {
      const el = this.barRef.current;
      if (!el) return;
      const s = window.scrollY > 10;
      el.style.paddingTop = s ? '4px' : '10px';
      el.style.paddingBottom = s ? '4px' : '10px';
      el.style.boxShadow = s ? '0 14px 34px -28px rgba(13,11,34,0.7)' : 'none';
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
    this.onDoc = (e) => {
      const el = this.langRef.current;
      if (this.state.langOpen && el && !el.contains(e.target)) this.setState({ langOpen: false });
    };
    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ langOpen: false }); };
    document.addEventListener('pointerdown', this.onDoc);
    document.addEventListener('keydown', this.onKey);
  }

  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.onMq);
    window.removeEventListener('scroll', this.onScroll);
    document.removeEventListener('pointerdown', this.onDoc);
    document.removeEventListener('keydown', this.onKey);
    document.body.style.overflow = '';
  }

  renderVals() {
    const b = this.props.base ?? '';
    const a = this.props.active ?? '';
    const rows = [
      ['how', 'How it works', b + 'how-it-works.html'],
      ['use', 'What it handles', b + 'use-cases.html'],
      ['pricing', 'Pricing', b + 'pricing.html'],
      ['resources', 'Resources', b + 'resources/index.html'],
      ['faq', 'FAQ', b + 'faq.html']
    ];
    const map = (r) => ({
      key: r[0], label: r[1], href: r[2],
      active: a === r[0], weight: a === r[0] ? 600 : 500,
      current: a === r[0] ? 'page' : undefined
    });
    return {
      nav: rows.map(map),
      navFull: rows.concat([['about', 'About', b + 'about.html']]).map(map),
      homeHref: b + 'index.html',
      contactHref: b + 'contact.html',
      narrow: this.state.ready && this.state.narrow,
      wide: !this.state.ready || !this.state.narrow,
      open: this.state.narrow && this.state.open,
      openStr: this.state.open ? 'true' : 'false',
      langRef: this.langRef,
      langOpen: this.state.langOpen,
      langOpenStr: this.state.langOpen ? 'true' : 'false',
      toggleLang: () => this.setState((s) => ({ langOpen: !s.langOpen })),
      toggle: () => this.setState((s) => {
        const next = !s.open;
        document.body.style.overflow = next ? 'hidden' : '';
        return { open: next };
      })
    };
  }
}
</script>
</body>
</html>
