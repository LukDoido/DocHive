<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<section style="background:linear-gradient(135deg,#5F5CEC 0%,#3667C8 55%,#12688F 100%);font-family:'Space Grotesk',system-ui,sans-serif">
  <div style="max-width:1180px;margin:0 auto;padding:clamp(56px,8vw,96px) clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:clamp(28px,4vw,56px)">
    <div style="max-width:640px">
      <p style="margin:0 0 18px;font-size:12px;letter-spacing:0.2em;font-weight:600;color:#FFFFFF;text-transform:uppercase">Next step</p>
      <p style="margin:0;font-size:clamp(26px,3.4vw,40px);line-height:1.15;letter-spacing:-0.03em;font-weight:600;color:#fff;text-wrap:pretty">{{ line }}</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <a href="{{ contactHref }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:13px;background:linear-gradient(135deg,#9AA2FB,#4FDDF3);color:#0D0B22;font-size:17px;font-weight:600;letter-spacing:-0.01em;text-decoration:none;transition:transform .2s ease,filter .2s ease" style-hover="transform:translateY(-2px);filter:brightness(1.06)">Book a 20 minute call</a>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#FFFFFF">No demo funnel. One call, an honest answer, and a number.</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:300},&quot;line&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Twenty minutes is enough to tell whether DocHive fits how you already file.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;base&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      line: this.props.line ?? 'Twenty minutes is enough to tell whether DocHive fits how you already file.',
      contactHref: (this.props.base ?? '') + 'contact.html'
    };
  }
}
</script>
</body>
</html>
